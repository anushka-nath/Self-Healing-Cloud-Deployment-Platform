---
# Prometheus configuration for scraping the Flask app and Kubernetes signals.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: self-healing-cloud-platform
    environment: local-minikube

scrape_configs:
  # Scrape Flask application metrics exposed at /metrics.
  - job_name: self-healing-flask-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - self-healing-api-service.self-healing-platform.svc.cluster.local:80
        labels:
          app: self-healing-api
          namespace: self-healing-platform

  # Scrape Kubernetes API server when Prometheus runs in-cluster.
  - job_name: kubernetes-api
    scheme: https
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
        action: keep
        regex: default;kubernetes

  # Optional kube-state-metrics job for pod and deployment visibility.
  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics.kube-system.svc.cluster.local:8080
