name: Container Build & Registry

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/container.yml'
  workflow_dispatch:

jobs:
  build-container:
    name: Build and Test Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: self-healing-api:${{ github.sha }}

      - name: Scan image for vulnerabilities
        run: |
          echo "Image scanning would be performed here"
          echo "Using tools like Trivy, Grype, or ECR image scanning"

      - name: Generate SBOM
        run: |
          echo "Software Bill of Materials (SBOM) generation"
          echo "Tools: syft, cyclonedx, or similar"
